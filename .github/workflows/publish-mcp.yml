# Lists the Stock Compass MCP server (https://stock-compass.app/api/mcp) in the
# official MCP Registry as io.github.Stock-Compass/stock-compass, from
# server.json. Runs when server.json changes on main, or by hand.
#
# Bump "version" in server.json with every change: the registry refuses a
# version it already has.
#
# GitHub OIDC rather than `mcp-publisher login github`: the interactive login
# cannot grant an organization's namespace
# (https://github.com/modelcontextprotocol/registry/issues/1468). OIDC grants
# the namespace of the organization that owns this repository, with no secret.

name: Publish to MCP Registry

on:
  push:
    branches: [main]
    paths: [server.json]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mcp-publisher 1.8.6
        run: |
          curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.6/mcp-publisher_linux_amd64.tar.gz
          echo "1fbe93fc0783c2394d8012c8d6e50a59e98cb2cc2d216264cc69f405d0e21340  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
